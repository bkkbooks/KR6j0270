body:
  text: 大契丹國師中天竺摩竭陀國三藏法師慈賢譯曩謨囉怛曩二合怛囉二合夜野一曩莫阿哩也二合二嚩路枳帝三濕嚩二合囉野四地怛嚩二合野五摩賀怛嚩二合野六摩賀迦嚕抳迦野七怛你也二合他唵引嚩婆曳數八怛囉二合喃九迦囉野十怛寫銘十一曩莫塞訖哩三合怛嚩二合十二伊𤚥阿哩也二合十三嚩路枳帝十四濕嚩二合囉十五怛嚩二合𩕳攞建姹十六曩麼𠶹哩二合娜野十七麼嚩哩二合跢伊灑弭也二合十八嚩囉他十九娑馱喃輸伴阿喏琰二合二十嚩部哆喃二十一婆嚩沫𭌇誐二十二尾戍馱劒二十四怛你也二合他二十五唵引阿路計阿路迦摩底二十六路迦底訖囒二合帝二十七呬呬賀𭋸二十八摩賀地怛嚩二合二十九娑麼囉娑麼囉三十𠶹哩二合娜野三十一矩嚕矩嚕羯哩𤚥二合三十二娑達野娑達野三十三度嚕度嚕尾演底三十四摩賀尾演底三十五達囉達囉達哩寅捺囉二合三十六濕嚩二合囉三十七左攞左攞三十八麼攞尾麼攞三十九阿摩攞母哩帝二合四十伊醯曳二合呬四十一路枳濕嚩二合囉四十二囉誐尾灑尾曩捨野四十三你吠二合灑尾灑尾曩捨也四十四謨賀左囉尾灑四十五尾曩捨也四十六護嚕護嚕麼攞護嚕四十七賀𭋸鉢娜麼二合曩婆四十八娑囉娑囉四十九悉哩悉哩五十素嚕素嚕五十一沒𠆙沒𠆙五十二馱野馱野五十三梅帝𭋸二合曳𩕳攞建姹五十四迦麼寫那捺哩捨二合喃五十五鉢囉二合賀娜野五十六摩諾娑嚩二合賀五十七悉馱野娑嚩二合賀五十八摩賀悉馱野娑嚩二合賀五十九悉馱喻擬濕嚩二合囉野娑嚩二合賀六十𩕳攞建姹野娑嚩二合賀六十一嚩囉阿穆佉僧賀目佉野娑嚩二合賀六十二鉢娜麼二合賀娑哆二合野娑嚩二合賀六十三作羯囉二合庾馱野娑嚩二合賀六十四商佉捨鉢哆𩕳達曩野娑嚩二合賀六十五摩賀攞矩吒馱囉野娑嚩二合賀六十六嚩麼娑謇二合馱捨悉體二合哆訖哩二合瑟拏二合喏曩野娑嚩二合賀六十七尾野二合伽囉二合拶囉麼二合𩕳嚩娑曩野娑嚩二合賀六十八曩謨囉怛曩二合怛囉夜野六十九曩莫阿哩也二合七十嚩路枳帝七十一濕嚩二合囉野娑嚩二合賀七十二悉鈿都銘滿怛囉二合鉢馱𩕳娑嚩二合賀引七十三
